# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # `secrets` can't be referenced directly in a step's `if:` (GitHub's
    # expression parser rejects it: "Unrecognized named-value: 'secrets'").
    # Hoist it into a job-level env var instead, which steps can read via
    # the `env` context — the standard workaround for this.
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        # Skip signing entirely if no GPG_PRIVATE_KEY secret is configured —
        # useful for a private registry that doesn't require signed
        # checksums. Once a signing key is set up as a repo secret, this
        # step (and the "unsigned" GoReleaser step below) activate
        # automatically — nothing else to change here.
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser (signed)
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Run GoReleaser (unsigned)
        if: ${{ env.HAS_GPG_KEY != 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
