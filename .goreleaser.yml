# Visit https://goreleaser.com for documentation on how to customize this
# behavior. Based on HashiCorp's official scaffolding template
# (terraform-provider-scaffolding-framework), fetched directly rather than
# hand-written from memory.
version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      # goreleaser does not work with CGO, it could also complicate
      # usage by users in CI/CD systems like HCP Terraform where
      # they are unable to install libraries.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
# GPG-signs the checksum file — required for the public Terraform Registry's
# trust model. If your private registry doesn't verify signatures, skip this
# at release time with `goreleaser release --clean --skip=sign` instead of
# deleting the block (keeps the option open without touching this file).
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # Immutable releases are enabled on the repo: a published release can never
  # receive assets afterwards. GoReleaser (>= 2.18) handles that itself: it
  # creates the release as a draft, uploads every asset, then publishes it —
  # fully automatic, nothing to click. Never create or publish a release from
  # the GitHub UI: a hand-made release for the tag is empty and immutable, and
  # the tag name is burned (v1.4.0, v1.5.0, v1.5.1 died that way).
  draft: false
  # If the workflow is re-run for a tag that already has a draft, keep it and
  # replace the assets instead of failing.
  mode: replace
changelog:
  disable: true
